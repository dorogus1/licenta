<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card" id="mainPage">
      <div class="timer" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button class="timer-btn minus" id="minusBtn">-</button>
        <button class="timer-btn" id="playPauseBtn">&#9654;</button>
        <button class="timer-btn plus" id="plusBtn">+</button>
      </div>
      <div class="reset-link" id="resetBtn">Reset</div>
      <div class="timer-hint">Use + to add 5 minutes or - to subtract 5 minutes</div>
    </div>
    <div class="page account-info" id="accountPage">
      <h3>Account</h3>
      <div id="accountDetails">Not logged in.</div>
    </div>
    <div class="page apps-list" id="appsPage">
      <h3>Apps</h3>
      <div class="label">Add app (base URL)</div>
      <div class="input-group apps-input">
        <input type="text" id="appUrlInput" placeholder="ex: facebook.com" aria-label="Add app base url">
        <button id="addAppBtn" class="add-btn" title="Add app">+</button>
      </div>
      <div class="label">Blocked Apps</div>
      <div class="apps-empty" id="appsEmpty">No blocked apps yet. Add one to get started.</div>
      <ul id="appsList" class="apps-list-ul"></ul>
    </div>
    <div class="page devices-list" id="devicesPage">
      <h3>Devices</h3>
      <div id="devicesDetails">No devices connected.</div>
    </div>
    <div class="nav">
      <button class="nav-btn selected" id="navMain">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
        Timer
      </button>
      <button class="nav-btn" id="navAccount">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
        Account
      </button>
      <button class="nav-btn" id="navApps">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Apps
      </button>
      <button class="nav-btn" id="navDevices">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><rect x="8" y="18" width="8" height="2" rx="1"/></svg>
        Devices
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

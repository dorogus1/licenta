<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" fetchpriority="high">
  <link rel="stylesheet" href="style.css" fetchpriority="high">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="container">
    
    <!-- PAGE 1: TIMER (HOME) -->
    <div class="page active" id="timerPage">
        <div class="card">
            <div class="timer" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button class="timer-btn minus" id="minusBtn">-</button>
                <button class="timer-btn" id="playPauseBtn">&#9654;</button>
                <button class="timer-btn plus" id="plusBtn">+</button>
            </div>
            <div class="reset-link" id="resetBtn">Reset</div>
            <div class="timer-hint">Focus Session</div>
        </div>
    </div>

    <!-- PAGE 2: CALENDAR -->
    <div class="page" id="calendarPage">
        <h3>Schedule</h3>
        
        <!-- Date Navigation -->
        <div class="calendar-nav" style="display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <button id="prevDayBtn" class="secondary-btn" style="width: auto; padding: 5px 12px;">&lt;</button>
            <span id="currentDateDisplay" style="font-weight: bold; color: white;">Today</span>
            <button id="nextDayBtn" class="secondary-btn" style="width: auto; padding: 5px 12px;">&gt;</button>
        </div>

        <div class="calendar-add-section">
            <div class="cal-header">
                <span class="cal-title">New Session</span>
            </div>
            
            <div class="cal-form">
                <div class="input-wrapper">
                    <label class="input-label-sm">Activity</label>
                    <input type="text" id="calEventTitle" class="cal-input" placeholder="e.g. Deep Work" autocomplete="off" />
                </div>

                <div class="input-wrapper">
                     <label class="input-label-sm">Date</label>
                     <input type="text" id="calEventDate" class="cal-input" placeholder="Select Date">
                </div>
                
                <div class="time-row">
                    <div class="time-col">
                        <label class="input-label-sm">Start Time</label>
                        <input type="text" id="calEventStartTime" class="cal-input" placeholder="00:00">
                    </div>
                    <div class="time-col">
                        <label class="input-label-sm">End Time</label>
                        <input type="text" id="calEventEndTime" class="cal-input" placeholder="00:00">
                    </div>
                </div>
                
                <button id="btnAddEvent" class="cal-add-btn">
                    <span>+ Schedule Session</span>
                </button>
            </div>
        </div>

        <div class="label" style="margin-top: 15px;">Sessions for this day</div>
        <ul id="calendarList" class="apps-list-ul">
            <li style="color: #666; font-size: 12px; text-align: center;">Loading events...</li>
        </ul>
        <button id="btnRefreshCalendar" class="secondary-btn" style="margin-top:10px; width:100%">Refresh List</button>
    </div>

    <!-- PAGE 3: APPS -->
    <div class="page apps-list" id="appsPage">
      <h3>Blocked Apps</h3>
      <div class="input-group apps-input">
        <input type="text" id="appUrlInput" placeholder="ex: facebook.com">
        <button id="addAppBtn" class="add-btn">+</button>
      </div>
      <ul id="appsList" class="apps-list-ul"></ul>
      <div class="apps-empty" id="appsEmpty">No blocked apps.</div>
    </div>

    <!-- PAGE 4: DEVICES -->
    <div class="page devices-list" id="devicesPage">
      <h3>Connected Devices</h3>
      <div id="devicesDetails">No devices connected.</div>
    </div>

    <!-- PAGE 5: ACCOUNT -->
    <div class="page account-info" id="accountPage">
      <h3>Settings & Account</h3>
      <div id="accountDetails">Not logged in.</div>
      <div id="accountActionsPublic">
        <button id="openLoginBtn" class="auth-btn" style="margin-top:10px; margin-right: 5px;">Login</button>
        <button id="openRegisterBtn" class="auth-btn" style="margin-top:10px;">Create account</button>
        <button id="themeToggleBtnPublic" class="auth-btn" style="margin-top:10px; background-color: #666;">Toggle Dark Mode</button>
      </div>
      <div id="accountActions" style="display:none;">
        <div class="account-email" id="accountEmail"></div>
        
        <button id="btnConnectCalendar" class="auth-btn" style="margin-top:10px; background-color: #4285F4; border-color: #4285F4;">Sync Calendar Permission</button>
        
        <button id="themeToggleBtn" class="auth-btn" style="margin-top:10px; background-color: #666;">Toggle Dark Mode</button>
        <button id="resetPasswordBtn" class="auth-btn" style="margin-top:10px;">Reset Password</button>
        <button id="logoutBtn" class="auth-btn" style="margin-top:10px; background-color: #333;">Logout</button>
        <div id="accountMsg" class="auth-error"></div>
      </div>
    </div>

    <div id="authContainer"></div>

    <!-- NAVIGATION BAR -->
    <div class="nav">
      <button class="nav-btn selected" id="navTimer">
        <!-- Clock Icon -->
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Focus
      </button>
      <button class="nav-btn" id="navCalendar">
        <!-- Calendar Icon -->
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Plan
      </button>
      <button class="nav-btn" id="navApps">
        <!-- Grid/Apps Icon -->
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Apps
      </button>
      <button class="nav-btn" id="navDevices">
        <!-- Devices Icon -->
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><rect x="8" y="18" width="8" height="2" rx="1"/></svg>
        Devices
      </button>
      <button class="nav-btn" id="navAccount">
        <!-- User Icon -->
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Acct
      </button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>

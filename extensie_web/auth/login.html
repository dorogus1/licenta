<div class="auth-overlay" id="authOverlay">
  <div class="auth-card" id="authCard">
    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab selected">Login</button>
      <button id="tabRegister" class="auth-tab">Register</button>
    </div>
    <form id="loginForm" class="auth-form">
      <input type="email" id="emailInput" placeholder="Email" required autocomplete="username">
      <input type="password" id="passwordInput" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="auth-btn">Login</button>
      
      <div style="text-align:center; margin: 10px 0; color:#aaa; font-size:12px;">OR</div>
      
      <button type="button" id="googleLoginBtn" class="auth-btn" style="background:#fff; color:#444; border:1px solid #ddd; display:flex; align-items:center; justify-content:center; gap:8px;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18">
        Sign in with Google
      </button>

      <div id="loginError" class="auth-error"></div>
    </form>
    <form id="registerForm" class="auth-form" style="display:none;">
      <input type="email" id="regEmailInput" placeholder="Email" required autocomplete="username">
      <input type="password" id="regPasswordInput" placeholder="Password" required autocomplete="new-password">
      <input type="password" id="regPasswordRepeat" placeholder="Repeat Password" required autocomplete="new-password">
      <button type="submit" class="auth-btn">Create Account</button>
      <div id="registerError" class="auth-error"></div>
    </form>
  </div>
</div>
